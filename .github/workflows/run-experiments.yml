name: Run Experiments

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-experiments:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate source layout
        run: python -m compileall src

      - name: Run TRiNC spotlight benchmark
        run: python main.py --algo trinc --artifacts-root artifacts/ci

      - name: Execute full controller sweep
        run: python experiments/run_all_algorithms.py --artifacts-root artifacts/ci

      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: trinc-results
          path: artifacts/ci/**
          if-no-files-found: warn
