name: Run Experiments

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-experiments:
    runs-on: ubuntu-latest
    env:
      ARTIFACTS_ROOT: artifacts/ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare artifact layout
        run: |
          rm -rf "$ARTIFACTS_ROOT"
          mkdir -p "$ARTIFACTS_ROOT"

      - name: Validate source layout
        run: python -m compileall src

      - name: Execute full controller sweep with tuning
        run: python experiments/run_all_algorithms.py --artifacts-root "$ARTIFACTS_ROOT" --tune --scenario all

      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: trinc-results
          path: ${{ env.ARTIFACTS_ROOT }}/**
          if-no-files-found: warn
